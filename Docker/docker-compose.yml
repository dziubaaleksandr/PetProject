version: "3.9"

services:
  web:
    build: 
      context: ..
      dockerfile: Docker/Dockerfile
    image: django_pet_project
    container_name: django-app
    command: >
      sh -c "sleep 10 &&
             python PetProject/manage.py migrate &&
             python PetProject/manage.py runserver 0.0.0.0:8000"
    volumes:
      - ..:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: postgres-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data/

volumes:
  postgres_data:
    name: pet_project_postgres_data
